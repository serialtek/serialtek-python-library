# Package configuration
[project]
name = "serialtek"
version = "0.0.1"
description = "API bindings for working with BusXpert and SerialTek logic analyzers."
authors = [{ name = "SerialTek", email = "support@serialtek.com" }]
readme = "README.md"
requires-python = ">=3.10"
# homepage = TODO
# repository = TODO
# documentation = TODO
# keywords = [] # TODO
# classifiers = [] # TODO
dependencies = [
    "requests>=2.28.1,<3.0.0",
    "pydantic>=2.1.1,<3.0.0",
    "typing-extensions>=4.2.0",
    "types-requests>=2.28.11.7,<3.0.0",
    "appdirs>=1.4.4,<2.0.0",
    "base91>=1.0.1,<2.0.0",
    "bidict>=0.22.1",
    "zeroconf>=0.131.0",
    "requests-toolbelt>=1.0.0,<2.0.0",
    "click>=8.1.3,<9.0.0",
    "click-option-group>=0.5.5",
    "pygments>=2.14.0,<3.0.0",
    "fastapi>=0.101.0",
    "rich>=13.3.2,<14.0.0",
]

[project.scripts]
stcli = "serialtek._cli.stcli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.287,<2.0.0",
    "black>=22.12.0,<23.0.0",
    "isort>=5.12.0,<6.0.0",
    "sphinx>=5,<6",
    "sphinx-design>=0.3.0,<0.4.0",
    "sphinx-autobuild>=2021.3.14,<2022.0.0",
    "sphinx-click>=4.4.0,<5.0.0",
    "sphinx-rtd-theme>=1.2.0,<2.0.0",
    "autodoc-pydantic>=2,<3",
    "pytest>=7.2.1,<8.0.0",
    "pre-commit>=3.4.0,<4.0.0",
    "ruff>=0.0.292,<0.0.293",
    "poethepoet>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serialtek"]

# Tool configurations

[tool.pyright]
typeCheckingMode = "strict"
ignore = [
    "scripts/*.py",
    "docs/source/conf.py",
]
include = [
    "src",
    "test",
]
pythonPlatform = "All"
reportImportCycles = false
# This is needed for TypeForm checking to work right, see https://github.com/microsoft/pyright/issues/11525
enableExperimentalFeatures = true

[tool.isort]
profile = "black"

[tool.black]
experimental_string_processing = true

[tool.pytest.ini_options]
testpaths = [ "test" ]
filterwarnings = [
    "ignore::urllib3.exceptions.InsecureRequestWarning",
]

[tool.ruff]
select = [
    "F", # pyflakes
    "E", # pycodestyle
    "UP", # pyupgrade
    "RUF", # Ruff-specific rules
    "YTT", # flake8-2020
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "T10", # flake8-debugger
    "EM", # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "INT", # flake8-gettext
    "FIX", # flake8-fixme
    "ERA", # eradicate
    "FLY", # flynt
    "PYI", # flake8-pyi
    "TRY", # tryceratops
    "PGH", # pygrep-hooks

    # These are checks that would be good to enable, but they still have a lot
    # of failures to address.
    # "D", # pydocstyle
    # "ARG", # flake8-unused-arguments

]

target-version = "py37"
pyupgrade = {keep-runtime-typing=true}

ignore = [
    "E501",   # Line too long
    "B009",   # gettattr with a constant attribute value
    "RET505", # else after return
    "RET506", # else after raise
    "RET507", # else after continue
    "RET508", # else after break
    "FIX002", # TODOs
    "PGH003", # type: ignore
    "SIM115", # using open() for files
    "E731",   # assigning to lambdas
    "E741",   # short variable names
]

exclude = [
    "src/serialtek/api.py",
]

[tool.ruff.per-file-ignores]
# Allow print statements in the cli, but not in the library code.
"src/serialtek/_cli/**" = ["T201"]

[tool.ruff.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "serialtek._model.BaseModel"]

# Tasks

# Tasks can be run with `poe <command>`, eg. `poe typecheck`

[tool.poe.tasks.lint]
help = "lint source code"
cmd = "ruff check src"

[tool.poe.tasks.fix]
help = "lint source code and auto-fix fixable issues"
cmd = "ruff check src --fix"

[tool.poe.tasks.typecheck]
help = "Run type checking"
cmd = "pyright"

[tool.poe.tasks.typecheck-interface]
help = "Check annotations for all pubilc interfaces"
cmd = "python -m pyright --verifytypes serialtek --ignoreexternal"

[tool.poe.tasks.doc-serve]
help = "Build the docs and serve locally."
cmd = "python -m sphinx_autobuild docs/source docs/build/html --watch src -D todo_include_todos=1 -t dev"

[tool.poe.tasks.doc-clean]
help = "Clean all generated docs files."
control = { script = "sys:stdout.write(sys.platform)" }
switch = [
    { case = "win32", cmd = "docs\\make.bat clean" },
    { cmd  = "make -C docs clean" },
]

[tool.poe.tasks.doc-build]
help = "Build the docs for distribution."
control = { script = "sys:stdout.write(sys.platform)" }
switch = [
    { case = "win32", cmd = "docs\\make.bat html" },
    { cmd  = "make -C docs html" },
]

[tool.poe.tasks.test]
help = "Run unit tests"
cmd = "python -m pytest"

[tool.poe.tasks.fmt]
help = "Autoformat code"
shell = """
black .
isort .
"""

[tool.poe.tasks.precommit]
help = "Run pre-commit checks"
cmd = "pre-commit run --all-files"

[tool.poe.tasks.install-precommit]
help = "Install the pre-commit hooks"
cmd = "pre-commit install -f"
